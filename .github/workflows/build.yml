name: Build

# Package Bungalow (codename "spacify") into three distributable forms:
#   - jar      : the runnable application jar + its dependency libs
#   - AppImage : a self-contained Linux .AppImage
#   - exe      : a portable Windows app image containing Bungalow.exe
#
# The build jobs run on pushes/PRs to main and on version tags. The release job
# then publishes a GitHub Release with all three artifacts:
#   - on a v* tag  -> a normal Release named after the tag
#   - on main push -> a rolling "nightly" prerelease (re-pointed each build)
# jpackage requires the first version component to be >= 1, so tag like v1.0.0.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version for a manual build (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ── Runnable jar (+ dependency libs) ─────────────────────────────────────────
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build (target/app = spacify.jar + lib/)
        run: mvn -B -DskipTests clean package

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version || '1.0.0' }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Zip the runnable jar bundle
        run: |
          cd target/app
          zip -r "../../Bungalow-${{ steps.v.outputs.version }}-jar.zip" spacify.jar lib

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: bungalow-jar
          path: Bungalow-*-jar.zip

  # ── Linux .AppImage ──────────────────────────────────────────────────────────
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25 (provides jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build (target/app)
        run: mvn -B -DskipTests clean package

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version || '1.0.0' }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: jpackage app-image
        run: |
          jpackage \
            --type app-image \
            --name Bungalow \
            --app-version "${{ steps.v.outputs.version }}" \
            --input target/app \
            --main-jar spacify.jar \
            --main-class se.spacify.app.SpacifyApp \
            --dest jpkg \
            --vendor "Bungalow" \
            --copyright "Copyright (c) Bungalow" \
            --description "Bungalow music player"

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr
          cp -r jpkg/Bungalow/* AppDir/usr/
          # Launcher entry point appimagetool runs on start.
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Bungalow" "$@"
          EOF
          chmod +x AppDir/AppRun
          # Desktop entry + icon (required by appimagetool).
          cat > AppDir/bungalow.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Bungalow
          Exec=Bungalow
          Icon=bungalow
          Categories=AudioVideo;Player;
          EOF
          # Reuse the icon jpackage generated in the image; fall back to a drawn one.
          cp AppDir/usr/lib/Bungalow.png AppDir/bungalow.png 2>/dev/null || \
            convert -size 256x256 xc:'#16324f' -gravity center \
              -pointsize 150 -fill '#9fd8ff' -annotate 0 'B' AppDir/bungalow.png

      - name: Build .AppImage with appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # No FUSE on CI runners -> extract-and-run instead of mounting.
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          ./appimagetool-x86_64.AppImage AppDir "Bungalow-${{ steps.v.outputs.version }}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: bungalow-appimage
          path: Bungalow-*-x86_64.AppImage

  # ── Windows exe (portable app image) ─────────────────────────────────────────
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25 (provides jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build (target/app)
        run: mvn -B -DskipTests clean package

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version || '1.0.0' }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: jpackage app-image (contains Bungalow.exe)
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name Bungalow \
            --app-version "${{ steps.v.outputs.version }}" \
            --input target/app \
            --main-jar spacify.jar \
            --main-class se.spacify.app.SpacifyApp \
            --dest jpkg \
            --vendor "Bungalow" \
            --copyright "Copyright (c) Bungalow" \
            --description "Bungalow music player"

      - name: Zip the Windows app image
        shell: pwsh
        run: Compress-Archive -Path jpkg/Bungalow/* -DestinationPath "Bungalow-${{ steps.v.outputs.version }}-windows-x64.zip"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: bungalow-windows-exe
          path: Bungalow-*-windows-x64.zip

  # ── Publish a GitHub Release with all three artifacts ────────────────────────
  release:
    needs: [ jar, appimage, exe ]
    runs-on: ubuntu-latest
    # Never publish from pull requests (no write token / not wanted).
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist

      # Tagged build -> a normal, named Release.
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true

      # main build -> refresh the rolling "nightly" prerelease so its tag and
      # assets point at the latest commit.
      - name: Remove previous nightly
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish nightly prerelease
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (latest main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/**
